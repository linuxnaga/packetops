name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7.0.20
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          tshark --version | head -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Generated docs are current
        run: python -m scripts.gen_docs --check
      - name: Tests
        env:
          PKO_TEST_MONGO_URI: mongodb://localhost:27017
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7.0.20
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PKO_APP_ENV: test
      PKO_CELERY_EAGER: "true"
      PKO_MONGO_DB: packetops_e2e
      PKO_DEV_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      PKO_STORAGE_LOCAL_ROOT: /tmp/pko/storage
      PKO_WORK_DIR: /tmp/pko/work
      PKO_CACHE_DIR: /tmp/pko/cache
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API (analysis runs in-process)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.db.migrations && python -m app.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Build and serve the web app
        working-directory: frontend
        run: |
          npm ci && npm run build
          nohup npx vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:4173/ >/dev/null && break; sleep 1; done
        env:
          PKO_API_URL: http://localhost:8000
      - name: Browser smoke test
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          PKO_WEB_URL=http://localhost:4173 PKO_E2E_SHOTS=/tmp/shots node e2e/smoke.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            /tmp/shots
            /tmp/api.log
            /tmp/web.log

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t packetops-backend:ci backend
      - name: Build frontend image
        run: docker build -t packetops-frontend:ci frontend
      - name: Image runs as non-root with tshark available
        run: |
          test "$(docker run --rm --entrypoint id packetops-backend:ci -u)" = "10001"
          docker run --rm --entrypoint tshark packetops-backend:ci --version | head -1
